services:
  # User Microservice
  - type: web
    name: blog-genius-user-service
    env: node
    rootDir: services/user
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: Cloud_Name
        sync: false
      - key: Cloud_Api_Key
        sync: false
      - key: Cloud_Api_Secret
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false

  # Author Microservice (AI & Blog creation)
  - type: web
    name: blog-genius-author-service
    env: node
    rootDir: services/author
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 5002
      - key: DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: Cloud_Name
        sync: false
      - key: Cloud_Api_Key
        sync: false
      - key: Cloud_Api_Secret
        sync: false

  # Blog Reader Microservice
  - type: web
    name: blog-genius-blog-service
    env: node
    rootDir: services/blog
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 5003
      - key: DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_SECRET
        sync: false
